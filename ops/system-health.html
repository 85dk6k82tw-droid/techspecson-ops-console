
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Health | TSO Ops Console</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body {
      background-color: #0d0f12;
      color: #e6e6e6;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    header {
      background: linear-gradient(90deg, #0a0a0a, #111827);
      color: #00bfff;
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 2px solid #00bfff33;
    }

    nav a {
      color: #38bdf8;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #fff;
      text-shadow: 0 0 8px #38bdf8;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 0 12px rgba(0, 191, 255, 0.08);
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 18px rgba(0, 191, 255, 0.18);
    }

    .card h3 {
      color: #38bdf8;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .status {
      font-weight: bold;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .ok { background-color: #065f46; color: #a7f3d0; }
    .warn { background-color: #92400e; color: #fcd34d; }
    .crit { background-color: #7f1d1d; color: #fecaca; }

    .bar {
      height: 10px;
      border-radius: 5px;
      background-color: #1f2937;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00bfff, #38bdf8);
      width: 0%;
      transition: width 1s ease;
    }

    footer {
      background-color: #0a0a0a;
      color: #6b7280;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
      border-top: 1px
